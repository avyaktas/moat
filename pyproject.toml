[tool.ruff]
line-length = 100
target-version = "py312"

# Not application code: alembic generates these and they follow its
# conventions, not ours.
exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: undefined names, unused imports, unused variables
    "I",    # import sorting
    "B",    # bugbear: likely bugs rather than style
    "UP",   # pyupgrade: outdated idioms
    "C4",   # comprehension simplifications
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    # Depends(get_db) and Query(...) in a default argument is FastAPI's
    # documented idiom, not the mutable-default-argument bug B008 targets.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import inside functions to keep monkeypatch targets
# unambiguous and to assert import-time behaviour.
"tests/*.py" = ["E402"]
# alembic's env.py imports after the sys.path setup those imports require.
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
# Tests live in one place, so pytest no longer has to be told where not
# to look. pythonpath puts the repo root on sys.path so `from moat.main
# import app` resolves without installing the package.
testpaths = ["tests"]
pythonpath = ["."]
